{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white text-center py-3">
            <h5 class="mb-0">پرداخت دستی - سفارش #{{ order.id|stringformat:".8s" }}</h5>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-primary d-flex justify-content-between align-items-center">
                <span>مبلغ قابل پرداخت:</span>
                <strong class="fs-5">{{ order.final_amount }} تومان</strong>
            </div>

            <h6 class="fw-bold mt-4 mb-2">اطلاعات حساب جهت واریز:</h6>
            <div class="border p-3 rounded mb-4 bg-light">
                <p class="mb-2"><strong>شماره کارت:</strong> <code class="fs-6">{{ card_number }}</code></p>
                <p class="mb-0"><strong>آدرس ولت USDT (TRC20):</strong> <code class="fs-6">{{ wallet_trc20 }}</code></p>
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="ref_id" class="form-label">کد پیگیری / شناسه تراکنش (TXID):</label>
                    <input type="text" name="ref_id" id="ref_id" class="form-control" placeholder="شماره پیگیری یا TXID واریزی">
                </div>

                <div class="mb-3">
                    <label for="receipt_image" class="form-label">تصویر فیش واریزی (اختیاری):</label>
                    <input type="file" name="receipt_image" id="receipt_image" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-success w-100 btn-lg mt-3">ثبت فیش و ارسال جهت تایید ادمین</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
