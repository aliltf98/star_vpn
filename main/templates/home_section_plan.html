{% load i18n %}

<div class="swiper mySwiper">
    <div class="swiper-wrapper">
        {% for plan in MainPL %}
            <div class="swiper-slide">
                <div class="swiper-plan-card">
                    <h3>{{ plan.title }}</h3>
                    <div class="plan-desc">
                        {{ plan.description|safe }}
                    </div>
                    <div class="card-footer-section">
                        {% if plan.old_price %}
                            <span class="plan-price" style="text-decoration: line-through 5px #ffffffb2;">{{ plan.old_price|floatformat:0 }} {% trans 'toman' %}</span>
                        {% endif %}
                        <span class="plan-price">{{ plan.price|floatformat:0 }} {% trans 'toman' %}</span>

                        <form action="{% url 'checkout' plan.pk %}" method="POST">
                            {% csrf_token %}
                            <button type="submit" class="plan-btn">
                                {% trans 'Choose plan' %}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

    <div class="swiper-pagination"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
</div>
