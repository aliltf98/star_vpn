{% load i18n %}

<div class="card-footer-section">
    <span class="plan-price">{{ plan.price|floatformat:0 }} {% trans 'toman' %}</span>

    <form action="{% url 'initiate_payment' plan.id %}" method="POST" style="margin-top: 15px;">
        {% csrf_token %}
        <button type="submit" class="button primary small plan-btn" style="width: 100%;">
            {% trans 'Choose plan' %}
        </button>
    </form>
</div>
