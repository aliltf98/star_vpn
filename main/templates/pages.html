{% extends "base.html" %}

{% block title %}
    {{ page.title }}
{% endblock title %}
{% block body %}

    <div id="main">
        <article class="post featured">
            <h1 style="position: relative;bottom: 50px;">{{ page.title }}</h1>
            {{ page.short_description|safe }}
            <div class="image main">
                <img src="{{ page.cover.url }}" style="height: 400px; border-radius: 10px; object-fit: cover" alt="">
            </div>
            <p>{{ page.page.description|safe }}</p>
            <div class="box alt">
                <div class="row gtr-50 gtr-uniform">
                    {% for p in page.page.image_gallery.all %}
                        <div class="col-4"><span class="image fit"><img
                                style="border-radius: 10px; height: 300px; object-fit: cover" src="{{ p.image.url }}"
                                alt=""></span></div>
                    {% endfor %}
                </div>
            </div>
        </article>
    </div>
{% endblock body %}
