{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}
    {{ MainH.title }}
{% endblock title %}

{% block body %}

    <div id="main">
        {% include 'home_section_page.html' %}
        {% include 'home_section_plan.html' %}
    </div>



    <style>
        .swiper { width: 100%; }
        .swiper-slide { display: flex !important; justify-content: center; height: auto !important; }

        .swiper-plan-card {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 16px !important;
            padding: 35px 30px !important;
            width: 100%;
            box-sizing: border-box;
            text-align: right;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s ease-in-out;
        }

        .swiper-plan-card:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            transform: translateY(-5px);
        }

        .swiper-plan-card h3 {
            margin-top: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
        }

        .swiper-plan-card .plan-desc {
            margin: 20px 0;
            font-size: 0.95rem;
            line-height: 1.8;
            color: #e0e6ed;
            flex-grow: 1;
        }

        .card-footer-section {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .swiper-plan-card .plan-price {
            display: block;
            margin-bottom: 20px;
            font-weight: 800;
            color: #dfb15b;
            font-size: 1.4rem;
            text-align: center;
        }

        .plan-btn {
            display: block !important;
            width: 100% !important;
            border-radius: 8px !important;
            height: 2.5rem !important;
            line-height: 2.5rem !important;
            font-weight: 500 !important;
            background-color: #dfb15b !important;
            color: #1e242b !important;
            transition: all 0.3s ease;
            box-shadow: none !important;
        }

        .plan-btn:hover {
            background-color: #fff !important;
            color: #1e242b !important;
            transform: scale(1.03);
        }

        .swiper-button-next, .swiper-button-prev { color: #fff; transform: scale(0.6); }
        .swiper-pagination-bullet { background: rgba(255, 255, 255, 0.3) !important; }
        .swiper-pagination-bullet-active { background: #dfb15b !important; width: 20px !important; border-radius: 4px !important; }
    </style>

    <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var swiper = new Swiper(".mySwiper", {
                direction: "horizontal",
                loop: false,
                spaceBetween: 20,
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                breakpoints: {
                    0: {slidesPerView: 1},
                    768: {slidesPerView: 2},
                    1000: {slidesPerView: 3}
                }
            });
        });
    </script>
{% endblock body %}
