{% extends "base.html" %}
{% load static %}

{% block title %}
    {{ MainH.title }}
{% endblock title %}

{% block body %}

    <div id="main">
        {% include 'home_section_page.html' %}
        {% include 'home_section_plan.html' %}
    </div>



    <style>
        .swiper {
            width: 100%;

        }

        .swiper-slide {
            display: flex !important;
            justify-content: center;
            height: auto !important;
        }

        .swiper-plan-card {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 16px !important;
            padding: 35px 30px !important;
            width: 100%;
            box-sizing: border-box;
            text-align: right;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.5s ease;
        }

        .swiper-plan-card:hover {
            background: rgba(250, 250, 250, 0.9) !important;
            border-color: rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 35px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease-out;
        }

        .swiper-plan-card h3 {
            margin-top: 0;
            font-size: 1.4rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .swiper-plan-card .plan-desc {
            margin: 20px 0;
            font-size: 0.9rem;
            line-height: 1.8;
            color: #364b5e;
            flex-grow: 1;
        }

        .card-footer-section {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .swiper-plan-card .plan-price {
            display: block;
            margin-bottom: 20px;
            font-weight: 800;
            color: #dfb15b;
            font-size: 1.3rem;
            text-align: center;
        }

        .plan-btn {
            display: block !important;
            width: 100% !important;
            border-radius: 8px !important;
            height: 2rem !important;
            line-height: 2rem !important;
            font-weight: 300 !important;
            letter-spacing: 0 !important;
            background-color: #364b5e !important;
            color: #c6e5ff !important;
            transition: all 0.5s ease;
            box-shadow: none !important;
        }

        .plan-btn:hover {
            background-color: #a3caec !important;
            font-weight: 900 !important;
            transform: scale(1.2);
            transition: all 0.5s ease-in-out;
            color: #364b5e !important;
        }

        .swiper-button-next, .swiper-button-prev {
            transform: scale(0.5);
            transition: color 0.5s ease;
        }

        .swiper-button-next:hover, .swiper-button-prev:hover {
            color: #ffd9d9 !important;
            transform: scale(0.8);
            transition: color 0.5s ease-in-out;
        }

        .swiper-pagination-bullet {
            background: rgba(129, 129, 129, 0.49) !important;
        }

        .swiper-pagination-bullet-active {
            background: #dfb15b !important;
            width: 20px !important;
            border-radius: 4px !important;
        }
    </style>

    <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var swiper = new Swiper(".mySwiper", {
                direction: "horizontal",
                loop: false,
                spaceBetween: 20,
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                breakpoints: {
                    0: {slidesPerView: 1},
                    768: {slidesPerView: 2},
                    1000: {slidesPerView: 3}
                }
            });
        });
    </script>
{% endblock body %}
