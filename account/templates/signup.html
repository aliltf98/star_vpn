{% load i18n %}
<h2>{% trans "Enter your information." %}</h2>
<form method="post" action="">
    {% csrf_token %}
    <div class="row gtr-uniform">
        <div class="col-6 col-12-xsmall">
            <input type="text" name="username" required value="" placeholder="{% trans 'username' %}" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="text" name="number" required value="" placeholder="{% trans 'Phone number' %}" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="password" name="pass1" required value="" placeholder="{% trans 'Password' %}" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="password" name="pass2" required value="" placeholder="{% trans 'Confirm Password' %}" />
        </div>
        <input type="hidden" name="reg" value="signup">
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <div class="col-12">
            <ul class="actions">
                <li><input type="submit" value="{% trans 'Sign up' %}" class="custombtn" /></li>
                <li><input type="reset" value="{% trans 'Reset Form' %}" class="custombtn" /></li>
            </ul>
        </div>
    </div>
</form>
