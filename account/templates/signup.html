
<h2>اطلاعات خود را وارد کنید</h2>
<form method="post" action="">
    {% csrf_token %}
    <div class="row gtr-uniform">
        <div class="col-6 col-12-xsmall">
            <input type="text" name="username" value="" placeholder="نام کاربری" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="text" name="number" value="" placeholder="شماره تلفن" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="password" name="pass1" value="" placeholder="کلمه عبور" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="password" name="pass2" value="" placeholder="تکرار کلمه عبور" />
        </div>
        <input type="hidden" name="reg" value="signup">
        <div class="col-12">
            <ul class="actions">
                <li><input type="submit" value="ثبت نام" class="primary icon solid fa-search" /></li>
                <li><input type="reset" value="بازنشانی فرم" /></li>
            </ul>
        </div>
    </div>
</form>
