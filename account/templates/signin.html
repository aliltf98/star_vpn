
<h2>اطلاعات خود را وارد کنید</h2>
<form method="post" action="">
    {% csrf_token %}
    <div class="row gtr-uniform">
        <div class="col-6 col-12-xsmall">
            <input type="text" name="username" required value="" placeholder=" شماره تلفن / نام کاربری" />
        </div>
        <div class="col-6 col-12-xsmall">
            <input type="password" name="pass1" required value="" placeholder="کلمه عبور" />
        </div>
        <input type="hidden" name="reg" value="signin">
        <div class="col-12">
            <ul class="actions">
                <li><input type="submit" value="ورود" class="primary icon solid fa-search" /></li>
            </ul>
        </div>
    </div>
</form>
