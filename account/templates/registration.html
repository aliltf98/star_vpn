{% extends "base.html" %}

{% block body %}

    <header id="header">
        <h3 class="logo" style="border-color: transparent">اطلاعات خود را وارد کنید</h3>
    </header>
    <nav id="nav" style="padding: 0 5rem 0 5rem !important; backdrop-filter: blur(8px)">

        <ul class="links">
            <li id="lisignin" class="active">
                <a href="#" onclick="changeTab(event, 'signin'); $('#lisignin').addClass('active'); $('#lisignup').removeClass('active')" class="pwa-signin-button">
                    ورود
                </a>
            </li>
            <li id="lisignup" >
                <a href="#" onclick="changeTab(event, 'signup'); $('#lisignup').addClass('active'); $('#lisignin').removeClass('active')" class="pwa-signup-button">
                    ثبت نام
                </a>
            </li>
        </ul>
        <ul class="icons">
            <li><a href="/" class=" fas fa-home"></a></li>
        </ul>
    </nav>
    <div id="main" style="backdrop-filter: blur(5px); background-color: rgba(240,248,255,0.57); margin-bottom: 10rem">
        <div class="tabcontent" id="signin">{% include "signin.html" %}</div>
        <div class="tabcontent" id="signup" style="display: none">{% include "signup.html" %}</div>
    </div>
{% endblock body %}
