{% extends 'dashboard/base_panel.html' %}{% load static %}

{% block content %}
    <div x-data="profileApp()"
         class=" rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900 shadow-sm">

        <!-- سربرگ کارت -->
        <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100 dark:border-gray-800">
            <div>
                <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
                    پروفایل کاربری
                </h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">مدیریت مشخصات فردی و اطلاعات حساب</p>
            </div>

            <!-- دکمه سوییچ حالت ویرایش -->
            <button
                    @click="isEditing = !isEditing; if(!isEditing) resetForm()"
                    type="button"
                    class="inline-flex items-center justify-center gap-2 rounded-[10px] border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-theme-xs transition-all hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700">
                <span x-text="isEditing ? 'انصراف' : 'ویرایش پروفایل'"></span>
            </button>
        </div>

        <!-- بدنه کارت / فرم -->
        <div class="p-4 sm:p-6">
            <form method="POST">
                {% csrf_token %}
                <!-- تغییر به یک ستونه (grid-cols-1) برای قرارگیری فیلدها زیر هم -->
                <div class="grid grid-cols-1 gap-5">

                    <!-- نام کاربری (غیرقابل ویرایش) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">نام
                            کاربری</label>
                        <input type="text" value="{{ request.user.username }}" disabled
                               class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-gray-100 px-4 py-2.5 text-sm font-normal text-gray-500 shadow-theme-xs cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">معرف</label>
                        <input type="text" value="{% if profile.referred_by %}{{ profile.referred_by.code }} {% else %}ندارد{% endif %}"
                               disabled
                               class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-gray-100 px-4 py-2.5 text-sm font-normal text-gray-500 shadow-theme-xs cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">
                    </div>

                    <!-- نام -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">نام</label>
                        <input type="text" name="first_name" x-model="form.first_name" :disabled="!isEditing"
                               class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800 dark:disabled:text-gray-500">
                    </div>

                    <!-- نام خانوادگی -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">نام
                            خانوادگی</label>
                        <input type="text" name="last_name" x-model="form.last_name" :disabled="!isEditing"
                               class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800 dark:disabled:text-gray-500">
                    </div>

                    <!-- شماره همراه -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">شماره
                            همراه</label>
                        <input type="text" name="phone_number" x-model="form.phone_number" :disabled="!isEditing"
                               class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 text-left dir-ltr">
                    </div>

                    <!-- ایمیل -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">پست
                            الکترونیکی</label>
                        <input type="email" name="email" x-model="form.email" :disabled="!isEditing"
                               class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800 dark:disabled:text-gray-500 text-left dir-ltr">
                    </div>

                    <!-- بخش اختصاصی مارکتر (اگر کاربر فروشنده بود) -->
                    {% if marketer_profile %}
                        <div class="pt-6 mt-2 border-t border-gray-100 dark:border-gray-800 space-y-4">
                            <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90">اطلاعات بازاریابی و
                                مالی</h4>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">کد
                                        معرف</label>
                                    <input type="text" value="{{ marketer_profile.code }}" disabled
                                           class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-gray-100 px-4 py-2.5 text-sm font-mono text-gray-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 text-center">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">موجودی
                                        کیف پول (تومان)</label>
                                    <input type="text" value="{{ marketer_profile.wallet_balance }}" disabled
                                           class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-gray-100 px-4 py-2.5 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">وضعیت
                                        حساب</label>
                                    <input type="text"
                                           value="{% if marketer_profile.is_active %}فعال{% else %}غیرفعال{% endif %}"
                                           disabled
                                           class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-gray-100 px-4 py-2.5 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">نام
                                    بانک</label>
                                <input type="text" name="bank_name" x-model="form.bank_name" :disabled="!isEditing"
                                       class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">شماره
                                    کارت (۱۶ رقمی)</label>
                                <input type="text" name="card_number" x-model="form.card_number" :disabled="!isEditing"
                                       maxlength="16"
                                       class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800 text-left dir-ltr">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">شماره
                                    شبا</label>
                                <input type="text" name="shaba_number" x-model="form.shaba_number"
                                       :disabled="!isEditing"
                                       class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs outline-hidden transition-colors focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 disabled:bg-gray-100 disabled:text-gray-500 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:disabled:bg-gray-800 text-left dir-ltr">
                            </div>
                        </div>
                    {% endif %}

                    <!-- دکمه ثبت نهایی -->
                    <template x-if="isEditing">
                        <div class="pt-4">
                            <button type="submit"
                                    class="inline-flex w-full items-center justify-center gap-2 rounded-[10px] border border-transparent bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs transition-all outline-none select-none hover:bg-brand-600 focus-visible:ring-3 focus-visible:ring-brand-500/20 focus-visible:outline-hidden active:translate-y-px dark:bg-brand-500 dark:hover:bg-brand-600">
                                ذخیره تغییرات
                            </button>
                        </div>
                    </template>

                </div>
            </form>
        </div>
    </div>

    <script>
        function profileApp() {
            return {
                isEditing: false,
                form: {
                    first_name: "{{ request.user.first_name|escapejs }}",
                    last_name: "{{ request.user.last_name|escapejs }}",
                    email: "{{ request.user.email|escapejs }}",
                    phone_number: "{{ profile.phone_number|default:''|escapejs }}",
                    {% if marketer_profile %}
                        bank_name: "{{ marketer_profile.bank_name|default:''|escapejs }}",
                        card_number: "{{ marketer_profile.card_number|default:''|escapejs }}",
                        shaba_number: "{{ marketer_profile.shaba_number|default:''|escapejs }}"
                    {% endif %}
                },
                resetForm() {
                    this.form = {
                        first_name: "{{ request.user.first_name|escapejs }}",
                        last_name: "{{ request.user.last_name|escapejs }}",
                        email: "{{ request.user.email|escapejs }}",
                        phone_number: "{{ profile.phone_number|default:''|escapejs }}",
                        {% if marketer_profile %}
                            bank_name: "{{ marketer_profile.bank_name|default:''|escapejs }}",
                            card_number: "{{ marketer_profile.card_number|default:''|escapejs }}",
                            shaba_number: "{{ marketer_profile.shaba_number|default:''|escapejs }}"
                        {% endif %}
                    };
                }
            }
        }
    </script>
{% endblock %}
